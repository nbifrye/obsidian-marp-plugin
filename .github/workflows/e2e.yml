name: E2E tests

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['**']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    desktop:
        name: Desktop (${{ matrix.os }}, ${{ matrix.obsidian }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                # app/installer pairs; see test/wdio.base.mts. 1.0.3 is the oldest
                # version wdio-obsidian-service can run, and the minAppVersion.
                obsidian: ['latest/latest', '1.0.3/earliest']
                # Obsidian 1.0.3 (Electron 18) crashes while rendering slides on
                # the windows-2025 image 20261018 and later, whatever the
                # Chromium flags; Windows Server 2022 still runs it.
                exclude:
                    - os: windows-latest
                      obsidian: '1.0.3/earliest'
                include:
                    - os: windows-2022
                      obsidian: '1.0.3/earliest'
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x
                  cache: 'npm'
            - run: npm ci

            - name: Cache Obsidian downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-${{ github.run_id }}
                  restore-keys: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-

            # Obsidian needs a display and a window manager on Linux.
            - name: Set up virtual display
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update -q
                  sudo apt-get install -q -y xvfb herbstluftwm
                  echo "DISPLAY=:99" >> "$GITHUB_ENV"
                  Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
                  sleep 1
                  DISPLAY=:99 herbstluftwm &
                  sleep 1

            - run: npm run test:e2e
              env:
                  OBSIDIAN_VERSIONS: ${{ matrix.obsidian }}
                  E2E_MAX_INSTANCES: 2

            - name: Upload screenshots and logs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-desktop-${{ matrix.os }}-${{ strategy.job-index }}
                  path: test-results/

    android:
        name: Android (${{ matrix.obsidian }})
        strategy:
            fail-fast: false
            matrix:
                obsidian: ['latest']
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24.x
                  cache: 'npm'
            - run: npm ci

            - name: Cache Obsidian downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .obsidian-cache
                  key: obsidian-android-${{ matrix.obsidian }}-${{ github.run_id }}
                  restore-keys: obsidian-android-${{ matrix.obsidian }}-

            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Run tests on an Android emulator
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  avd-name: obsidian_test
                  api-level: 36
                  arch: x86_64
                  target: google_apis
                  profile: pixel
                  disk-size: 4096M
                  heap-size: 512M
                  emulator-options: -no-snapshot -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  script: npm run test:e2e:android
              env:
                  OBSIDIAN_VERSIONS: ${{ matrix.obsidian }}

            - name: Upload screenshots and logs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-android-${{ strategy.job-index }}
                  path: test-results/
